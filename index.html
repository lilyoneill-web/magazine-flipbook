
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magazine Flipbook</title>

  <!-- Open-source page-turn engine -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <!-- PDF renderer -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 12px;
      color: #262626;
      background: #f0eee9;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #app {
      width: 100%;
      max-width: 1050px;
      margin: auto;
    }

    #book {
      width: 100%;
      margin: auto;
    }

    .page {
      background: white;
      overflow: hidden;
    }

    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #status {
      padding: 30px 10px;
      font-size: 14px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0 16px;
    }

    button, .download {
      padding: 11px 17px;
      border: 1px solid #262626;
      border-radius: 2px;
      background: #262626;
      color: white;
      font: inherit;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: .4;
      cursor: default;
    }

    #counter {
      min-width: 100px;
      font-size: 13px;
    }

    #error {
      color: #a52a2a;
      font-size: 14px;
      white-space: pre-wrap;
    }

    @media (max-width: 600px) {
      body { padding: 12px 4px; }
      .controls { gap: 8px; margin-top: 16px; }
      button, .download { padding: 10px 12px; }
    }
  </style>
</head>

<body>
  <main id="app">
    <div id="status">Opening magazine...</div>
    <div id="book"></div>

    <div class="controls">
      <button id="prev" disabled>← Previous</button>
      <span id="counter">Loading...</span>
      <button id="next" disabled>Next →</button>
    </div>

    <a class="download" href="./magazine.pdf" download="magazine.pdf">
      Download PDF ↓
    </a>

    <p id="error" role="status"></p>
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const status = document.getElementById("status");
    const bookElement = document.getElementById("book");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const counter = document.getElementById("counter");
    const error = document.getElementById("error");

    let flipbook;
    let totalPages = 0;

    function updateControls(index) {
      counter.textContent =
        `Page ${index + 1} of ${totalPages}`;

      prev.disabled = index <= 0;
      next.disabled = index >= totalPages - 1;
    }

    async function startFlipbook() {
      try {
        // PDF is hosted alongside this HTML file.
        const pdf = await pdfjsLib.getDocument(
          "./magazine.pdf"
        ).promise;

        totalPages = pdf.numPages;

        if (totalPages < 1) {
          throw new Error("This PDF has no pages.");
        }

        const firstPage = await pdf.getPage(1);
        const originalViewport =
          firstPage.getViewport({ scale: 1 });

        // Base dimensions preserve the PDF page's proportions.
        const pageWidth = 420;
        const pageHeight = Math.round(
          pageWidth *
          originalViewport.height /
          originalViewport.width
        );

        const pages = [];

        // Render sequentially to compressed images to limit
        // the memory used by full-resolution canvases.
        for (let number = 1; number <= totalPages; number++) {
          status.textContent =
            `Preparing magazine: ${number} / ${totalPages}`;

          const pdfPage = number === 1
            ? firstPage
            : await pdf.getPage(number);

          const base = pdfPage.getViewport({ scale: 1 });
          const scale = Math.min(
            1.5,
            1400 / base.height
          );

          const viewport = pdfPage.getViewport({ scale });
          const canvas = document.createElement("canvas");

          canvas.width = Math.ceil(viewport.width);
          canvas.height = Math.ceil(viewport.height);

          const context = canvas.getContext("2d", {
            alpha: false
          });

          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, canvas.width, canvas.height);

          await pdfPage.render({
            canvasContext: context,
            viewport
          }).promise;

          const image = document.createElement("img");
          image.alt = `Magazine page ${number}`;
          image.src = canvas.toDataURL("image/jpeg", 0.86);

          const page = document.createElement("div");
          page.className = "page";
          page.appendChild(image);
          pages.push(page);

          // Release the large canvas buffer.
          canvas.width = 0;
          canvas.height = 0;
        }

        flipbook = new St.PageFlip(bookElement, {
          width: pageWidth,
          height: pageHeight,
          size: "stretch",
          minWidth: 150,
          maxWidth: 700,
          minHeight: 200,
          maxHeight: 1000,
          showCover: true,
          usePortrait: true,
          startPage: 0,
          drawShadow: true,
          maxShadowOpacity: 0.3,
          flippingTime: 800,
          autoSize: true,
          mobileScrollSupport: false
        });

        flipbook.loadFromHTML(pages);

        flipbook.on("flip", event => {
          updateControls(event.data);
        });

        prev.addEventListener("click", () => {
          flipbook.flipPrev();
        });

        next.addEventListener("click", () => {
          flipbook.flipNext();
        });

        updateControls(0);
        status.hidden = true;

      } catch (err) {
        console.error(err);
        status.textContent = "Unable to open the magazine.";
        error.textContent =
          "Check that magazine.pdf is uploaded beside index.html " +
          "and that the PDF is valid. Details: " + err.message;
      }
    }

    startFlipbook();
  </script>
</body>
</html>
